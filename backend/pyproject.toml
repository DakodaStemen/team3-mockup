[project]
name = "planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "networkx",
  "instructor",
  "openai",
  "structlog",
  "scikit-learn",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
