[project]
name = "planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "networkx",
  "instructor",
  "openai",
  "structlog",
  "scikit-learn",
  "pdfplumber>=0.11.10",
  "beautifulsoup4>=4.15.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
