# Change request form (Sommerville Fig 25.15). Required for requirement/ADR changes after the SRS v1.0 baseline.
name: Change request
description: Propose a change to a requirement, design decision, or released behavior
labels: [change-request]
body:
  - type: textarea
    id: change
    attributes: { label: Requested change, description: What should change? }
    validations: { required: true }
  - type: textarea
    id: reason
    attributes: { label: Reason, description: Why, and what happens if we do NOT make it? }
    validations: { required: true }
  - type: input
    id: reqs
    attributes: { label: Affected SRS IDs, placeholder: "FR-4, NFR-2" }
  - type: input
    id: components
    attributes: { label: Components affected, placeholder: "planner/engine.py, frontend/src/App.tsx" }
  - type: input
    id: associated
    attributes: { label: Associated components (may need retest) }
  - type: textarea
    id: assessment
    attributes: { label: Change assessment (area owner), description: "Impact via TRACEABILITY.md; benefits; users affected; cost; release cycle" }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [Low, Medium, High] }
  - type: input
    id: effort
    attributes: { label: Estimated effort, placeholder: "e.g. 4 hours" }
  - type: textarea
    id: decision
    attributes: { label: CCB decision, description: "Accept/reject, target release, date (filled in by CCB)" }
